[project]
name = "market-regime-engine"
version = "0.1.0"
description = "Point-in-time market regime engine for SPX / 0DTE options decision support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_engine"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.108",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["AGENTS.md", "CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PL", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["regime_engine"]

[tool.ruff.lint.per-file-ignores]
# Literal assertions are idiomatic pytest style; magic-value flagging is
# aimed at production logic, not test expectations.
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=regime_engine --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "live: tests that call live/paid data providers (skipped by default)",
]

[tool.coverage.run]
source = ["src/regime_engine"]
branch = true
