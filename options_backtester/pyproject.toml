[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "options-backtester"
version = "0.1.0"
description = "Decoupled, provider-agnostic multi-leg options backtesting engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=15",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.54"]
ibkr = ["ib_insync>=0.9.86"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
options-backtester = "options_backtester.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/options_backtester"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
