[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "spx-0dte-backtest"
version = "0.1.0"
description = "Point-in-time SPX 0DTE options research and backtesting framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "exchange-calendars>=4.5,<5",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=15,<24",
    "scipy>=1.12,<2",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
    "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
spx-0dte = "spx_0dte_backtest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spx_0dte_backtest"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

